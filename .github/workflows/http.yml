# The HTTP engine's gate, and bend-wire's (wire/) that it, RESP and
# bend-h2 are built on: the laws check, the server builds, the checks
# pass against it and against the C control, the fuzzer finds no
# difference between the two, the RESP server answers, bend-h2 passes
# h2spec and its own checks, and the binaries are kept. Runs on the
# branch that carries the engine and only when it, the library, RESP,
# bend-h2 or the runtime moves.
name: http engine
on:
  push:
    branches: [omen-http, claude/next-gen-tier-review-xss592]
    paths: ["demos/io_http_engine/**", "demos/io_resp/**", "demos/io_http2/**", "wire/**", "power/csv*",
      "bend2/**", "kernel/**", ".github/workflows/http.yml"]
  pull_request:
    paths: ["demos/io_http_engine/**", "demos/io_resp/**", "demos/io_http2/**", "wire/**", "power/csv*",
      "bend2/**", "kernel/**", ".github/workflows/http.yml"]
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang
      # The verdict line, not the exit code: a proof that leans on
      # @unsafe or a foreign def exits 0 with "All terms check, but ..."
      - name: the laws hold
        run: |
          for f in demos/io_http_engine/PROOF.bend demos/io_resp/PROOF.bend power/csv_proof.bend \
            demos/io_http2/PROOF.bend; do
            out=$(bun bend2/main.ts "$f"); echo "$out"
            [ "$out" = "All terms check." ] || { echo "$f: not a clean proof"; exit 1; }
          done
      # The de Bruijn criterion: a second, independent kernel (kernel/,
      # Rust, no crates) re-checks the exported core of each proof from
      # scratch; its verdict must be PASS too
      - name: the laws hold in a second kernel
        run: |
          cargo build --release --manifest-path kernel/Cargo.toml
          bash kernel/tests/run.sh
          for f in demos/io_http_engine/PROOF.bend demos/io_resp/PROOF.bend power/csv_proof.bend \
            demos/io_http2/PROOF.bend; do
            bun bend2/main.ts "$f" --export proof.core
            kernel/target/release/bend-kernel -q proof.core || { echo "$f: the kernel refuses it"; exit 1; }
          done
      # each mutant breaks the loop (wire/loop.bend) as one of the
      # review's bugs did, and the laws of the world must refuse every
      # one; each of the framing's
      # breaks the reader or the spec, and frame_sim alone must refuse it
      - name: the laws are not vacuous
        run: python3 demos/io_http_engine/mutants.py
      # each of bend-h2's mutants breaks HPACK, the framing, the stream
      # states, flow control, a budget or the request checks, and the
      # proof must refuse every one
      - name: bend-h2's laws are not vacuous
        run: python3 demos/io_http2/mutants.py
      - name: the server builds
        run: |
          bun bend2/main.ts demos/io_http_engine/main.bend -o httpd
          ldd httpd
      - name: the C twins build
        working-directory: demos/io_http_engine
        run: |
          cc -std=c11 -O3 -Wall control.c -o control
          cc -std=c11 -O3 -Wall check.c -o check
          cc -std=c11 -O3 -Wall -DCHECK_TLS check.c -o check-tls -lssl -lcrypto
          cc -std=c11 -O2 -Wall fuzz.c -o fuzz
          cc -std=c11 -O3 -Wall load.c -o load
      - name: fixtures
        run: |
          mkdir -p www/sub
          printf '<h1>hi</h1>\n' > www/index.html
          printf 'alpha\n' > www/a.txt
          python3 -c "open('www/img.png','wb').write(bytes(range(256)))"
          printf 'b{}\n' > www/sub/b.css
      # --root=www: the check writes its own fixtures there (a symbolic
      # link to /etc/passwd and one to /etc, a dotfile, 1, 4 and 16 MiB
      # files) and reads the server's VmHWM after streaming them
      - name: the checks, every mode
        run: |
          up() { for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; echo "never listened on $1"; return 1; }
          C=demos/io_http_engine
          ./httpd --root www --idle-ms 400 --log 2>log.txt & up 8080; $C/check 8080 $! --files --idle=400 --ws --log=log.txt --root=www; kill $!; wait $! || true
          ./httpd --max-conns 2 & up 8080; $C/check 8080 $! --conns=2; kill $!; wait $! || true
          ./httpd --grace-ms 3000 & up 8080; $C/check 8080 $! --term
          $C/control 8081 & up 8081; $C/check 8081 $!; kill $!; wait $! || true
      # --guard: 600 pipelined GETs of a 100 KB file against VmHWM, a
      # peer that never reads, a head dribbled past --head-ms, a 431 and
      # a 414, 80 idle peers against `ulimit -n 64`, and SIGTERM under a
      # storm of arrivals, which also ends the server
      - name: the budgets hold
        run: |
          up() { for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; echo "never listened on $1"; return 1; }
          C=demos/io_http_engine
          python3 -c "open('www/big.bin','wb').write(bytes(i % 251 for i in range(100000)))"
          (ulimit -n 64; exec ./httpd --root www --idle-ms 1000 --head-ms 1500 --grace-ms 3000) & up 8080
          $C/check 8080 $! --files --guard
          wait $! || true
      # the bridge between the proofs and C: each effect the model makes
      # assumptions of, driven through its contract's cases and judged by
      # world.bend's relations, with conform.c as its peer
      - name: the effects keep their contracts
        run: |
          bun bend2/main.ts wire/conform.bend -o conform
          cc -std=c11 -O2 -Wall wire/conform.c -o conform-peer
          ./conform-peer ./conform 8095 "$PWD/conform-root/root"
      - name: the RESP server answers on bend-wire
        run: |
          bun bend2/main.ts demos/io_resp/main.bend -o respd
          python3 demos/io_resp/smoke.py ./respd 6380
      - name: the engine and the control agree on 500 random streams
        run: |
          up() { for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; return 1; }
          C=demos/io_http_engine
          ./httpd --port 8090 & A=$!; up 8090
          $C/control 8091 & B=$!; up 8091
          $C/fuzz 8090 8091 500 7
          kill $A $B; wait $A $B || true
      - name: the same checks over TLS
        run: |
          up() { for _ in $(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; return 1; }
          C=demos/io_http_engine
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 2 -nodes -subj "/CN=localhost"
          ./httpd --port 8443 --tls-cert cert.pem --tls-key key.pem --root www --idle-ms 600 --log 2>tlog.txt & up 8443
          $C/check-tls 8443 $! --files --idle=600 --ws --log=tlog.txt --root=www
          kill $!; wait $! || true
          ./httpd --port 8443 --tls-cert cert.pem --tls-key key.pem --max-conns 2 & up 8443
          $C/check-tls 8443 $! --conns=2; kill $!; wait $! || true

      - name: a shared port takes two copies, and --workers forks them
        run: |
          up() { for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; return 1; }
          ./httpd --shared --port 8085 & A=$!; ./httpd --shared --port 8085 & B=$!; up 8085
          LOAD_SPIN=1 demos/io_http_engine/load 8085 32 2 8 /health
          kill $A $B; wait $A $B || true
          ./httpd --workers 2 --shared --port 8086 & A=$!; up 8086
          LOAD_SPIN=1 demos/io_http_engine/load 8086 32 2 1 /health
          kill $A; wait $A
      # bend-h2: h2c by prior knowledge and h2 over TLS by ALPN, each run
      # through h2spec (every section, strict), then check.py's client:
      # requests, fifty streams at once, 1 MB through the windows both
      # ways, and each flood budget met
      - name: bend-h2 answers, and passes h2spec
        run: |
          up() { for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; return 1; }
          pip install -q h2
          curl -fsSL -o h2spec.tgz https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          tar xzf h2spec.tgz h2spec
          bun bend2/main.ts demos/io_http2/main.bend -o h2d
          ./h2d --port 8443 & up 8443
          ./h2spec -h 127.0.0.1 -p 8443 -S
          python3 demos/io_http2/check.py 8443
          kill $!; wait $! || true
          ./h2d --port 8444 --tls-cert cert.pem --tls-key key.pem & up 8444
          ./h2spec -h 127.0.0.1 -p 8444 -t -k -S
          kill $!; wait $! || true
      - uses: actions/upload-artifact@v4
        with:
          name: httpd-linux-x86_64
          path: httpd
      - uses: actions/upload-artifact@v4
        with:
          name: h2d-linux-x86_64
          path: h2d
