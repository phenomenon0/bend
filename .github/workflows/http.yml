# The HTTP engine's gate, and bend-wire's (wire/) that it, RESP and
# bend-h2 are built on: the laws check, in both kernels, and are not
# vacuous; the server builds, the checks pass against it and against the
# C control, the fuzzer finds no difference between the two, the RESP
# server answers, bend-h2 passes h2spec and its own checks, and the
# binaries are kept. Runs on the branch that carries the engine and only
# when it, the library, RESP, bend-h2 or the runtime moves.
#
# One job per concern, side by side: the proofs, the second kernel, each
# mutant set's shards (every mutant of every set, every push: none is
# left for later), and the live checks, most of which share one build. Each
# mutant runs in a scratch tree of its own, re-checked from the file it
# breaks on (wire/mutate.py), -j nproc; --shard i/n takes every n-th.
name: http engine
on:
  push:
    branches: [omen-http, claude/next-gen-tier-review-xss592]
    paths: ["demos/io_http_engine/**", "demos/io_proxy/**", "demos/io_resp/**", "demos/io_http2/**",
      "demos/io_sink/**", "demos/io_http_client/**", "wire/**", "net/**", "power/csv*", "power/gzip*",
      "power/deflate*", "power/json*", "bend2/**", "kernel/**", "tests/fuzz/**", ".github/workflows/http.yml"]
  pull_request:
    paths: ["demos/io_http_engine/**", "demos/io_proxy/**", "demos/io_resp/**", "demos/io_http2/**",
      "demos/io_sink/**", "demos/io_http_client/**", "wire/**", "net/**", "power/csv*", "power/gzip*",
      "power/deflate*", "power/json*", "bend2/**", "kernel/**", "tests/fuzz/**", ".github/workflows/http.yml"]
env:
  BEND_NO_TELEMETRY: "1"
  PROOFS: >-
    demos/io_http_engine/PROOF.bend demos/io_resp/PROOF.bend power/csv_proof.bend
    demos/io_http2/PROOF.bend wire/http1/PROOF.bend wire/client.bend wire/pool.bend wire/world.bend
    demos/io_proxy/PROOF.bend net/ws_proof.bend net/PROOF.bend
defaults:
  run:
    shell: bash
jobs:
  # The verdict line, not the exit code: a proof that leans on @unsafe or
  # a foreign def exits 0 with "All terms check, but ..."
  proofs:
    name: the laws hold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: the laws hold
        run: |
          mkdir -p verdicts
          printf '%s\n' $PROOFS | xargs -P "$(nproc)" -I{} sh -c \
            'bun bend2/main.ts "$1" > "verdicts/$(echo "$1" | tr / _)" 2>&1 || true' _ {}
          bad=0
          for f in $PROOFS; do
            out=$(cat "verdicts/$(echo "$f" | tr / _)"); echo "$f: $out"
            [ "$out" = "All terms check." ] || { echo "$f: not a clean proof"; bad=1; }
          done
          exit $bad
  # The de Bruijn criterion: a second, independent kernel (kernel/, Rust,
  # no crates) re-checks the exported core of every proof from scratch;
  # its verdict must be PASS too
  kernel:
    name: the laws hold in a second kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: kernel/target
          key: kernel-${{ runner.os }}-${{ hashFiles('kernel/Cargo.lock', 'kernel/Cargo.toml', 'kernel/src/**') }}
      - name: the laws hold in a second kernel
        run: |
          cargo build --release --manifest-path kernel/Cargo.toml
          bash kernel/tests/run.sh
          mkdir -p cores
          printf '%s\n' $PROOFS | xargs -P "$(nproc)" -I{} sh -c \
            'bun bend2/main.ts "$1" --export "cores/$(echo "$1" | tr / _).core"' _ {}
          for f in $PROOFS; do
            kernel/target/release/bend-kernel -q "cores/$(echo "$f" | tr / _).core" \
              || { echo "$f: the kernel refuses it"; exit 1; }
          done
  # The laws are not vacuous. engine: each mutant breaks the loop
  # (wire/loop.bend) as one of the review's bugs did and the laws of the
  # world refuse it, or breaks the framing's reader or spec and frame_sim
  # alone refuses it. h2: HPACK, the framing, the stream states, flow
  # control, a budget or the request checks. http1: the response reader's
  # framing, as a splitting or smuggling bug would; resp_sim alone must
  # refuse it. client: a connection reused when it must not be, a read
  # past the deadline or the head's cap, a pooled connection handed out
  # when it must not be, a body stream that reads with its window full,
  # waits on a stalled consumer, reorders, drops, trusts too much or
  # tells its end early or twice. proxy: the client's bytes passed
  # through, a hop-by-hop field forwarded, a read on after a refusal, a
  # request or a response unchecked, a length not its body's.
  # ws: a frame the RFC forbids let through, one sent unmasked, a
  # handshake taken that must be refused (ws_laws.bend). net: a handler
  # handed what the RFC did not frame, a response a client would frame
  # otherwise, a wrong route, a pooled connection its response closed, a
  # redirect too far or with credentials (net/PROOF.bend).
  mutants:
    name: mutants ${{ matrix.set }} ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { set: engine, shard: 0/2, run: demos/io_http_engine/mutants.py }
          - { set: engine, shard: 1/2, run: demos/io_http_engine/mutants.py }
          - { set: h2, shard: 0/2, run: demos/io_http2/mutants.py }
          - { set: h2, shard: 1/2, run: demos/io_http2/mutants.py }
          - { set: net, shard: 0/3, run: net/mutants.py }
          - { set: net, shard: 1/3, run: net/mutants.py }
          - { set: net, shard: 2/3, run: net/mutants.py }
          - { set: ws, shard: 0/2, run: net/ws_mutants.py }
          - { set: ws, shard: 1/2, run: net/ws_mutants.py }
          - { set: http1, shard: 0/1, run: wire/http1/mutants.py }
          - { set: client, shard: 0/1, run: wire/client_mutants.py }
          - { set: proxy, shard: 0/1, run: demos/io_proxy/mutants.py }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: the laws are not vacuous
        run: python3 ${{ matrix.run }} --shard ${{ matrix.shard }}
  # the compiler is trusted, not proven: random well-typed programs
  # (tests/fuzz, seed 1) must print the same in the interpreter, JS and C
  # (-O3, and on one thread); the CI mode runs no sanitizer
  fuzz:
    name: the compiler's lanes agree
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang
      - name: 100 random programs agree in every lane
        run: bun tests/fuzz/fuzz.ts --ci
  # the binaries the live checks run, built once
  build:
    name: the server and its peers build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang
      - name: build
        run: |
          b() { bun bend2/main.ts "$1" -o "$2" > "$2.log" 2>&1; s=$?; cat "$2.log"; return $s; }
          p=()
          b demos/io_http_engine/main.bend httpd & p+=($!)
          b demos/io_http2/main.bend h2d & p+=($!)
          b wire/conform.bend conform & p+=($!)
          b demos/io_http_client/main.bend hc & p+=($!)
          b demos/io_proxy/main.bend proxyd & p+=($!)
          b net/ws_cli.bend wsc & p+=($!)
          b net/examples/ws_echo.bend wsecho & p+=($!)
          b demos/io_resp/main.bend respd & p+=($!)
          b demos/io_sink/main.bend sink & p+=($!)
          C=demos/io_http_engine
          cc -std=c11 -O3 -Wall $C/control.c -o control
          cc -std=c11 -O3 -Wall $C/check.c -o check
          cc -std=c11 -O3 -Wall -DCHECK_TLS $C/check.c -o check-tls -lssl -lcrypto
          cc -std=c11 -O2 -Wall $C/fuzz.c -o fuzz
          cc -std=c11 -O3 -Wall $C/load.c -o load
          cc -std=c11 -O2 -Wall wire/conform.c -o conform-peer -lssl -lcrypto
          for i in "${p[@]}"; do wait "$i"; done
          ldd httpd
          tar czf bins.tgz httpd h2d conform hc proxyd wsc wsecho respd sink control check check-tls fuzz load conform-peer
      - uses: actions/upload-artifact@v4
        with:
          name: bins
          path: bins.tgz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: httpd-linux-x86_64
          path: httpd
      - uses: actions/upload-artifact@v4
        with:
          name: h2d-linux-x86_64
          path: h2d
  # the engine against check.c in every mode, the budgets, the fuzzer
  # against the C control, TLS, and a shared port
  engine:
    name: the engine's checks
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bins
      - name: fixtures
        run: |
          tar xzf bins.tgz
          mkdir -p www/sub
          printf '<h1>hi</h1>\n' > www/index.html
          printf 'alpha\n' > www/a.txt
          python3 -c "open('www/img.png','wb').write(bytes(range(256)))"
          printf 'b{}\n' > www/sub/b.css
      # --root=www: the check writes its own fixtures there (a symbolic
      # link to /etc/passwd and one to /etc, a dotfile, 1, 4 and 16 MiB
      # files) and reads the server's VmHWM after streaming them
      - name: the checks, every mode
        run: |
          up() { for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; echo "never listened on $1"; return 1; }
          ./httpd --root www --idle-ms 400 --log 2>log.txt & up 8080; ./check 8080 $! --files --idle=400 --ws --log=log.txt --root=www; kill $!; wait $! || true
          ./httpd --max-conns 2 & up 8080; ./check 8080 $! --conns=2; kill $!; wait $! || true
          ./httpd --grace-ms 3000 & up 8080; ./check 8080 $! --term
          ./control 8081 & up 8081; ./check 8081 $!; kill $!; wait $! || true
      # --guard: 600 pipelined GETs of a 100 KB file against VmHWM, a
      # peer that never reads, a head dribbled past --head-ms, a 431 and
      # a 414, 80 idle peers against `ulimit -n 64`, and SIGTERM under a
      # storm of arrivals, which also ends the server
      - name: the budgets hold
        run: |
          up() { for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; echo "never listened on $1"; return 1; }
          python3 -c "open('www/big.bin','wb').write(bytes(i % 251 for i in range(100000)))"
          (ulimit -n 64; exec ./httpd --root www --idle-ms 1000 --head-ms 1500 --grace-ms 3000) & up 8080
          ./check 8080 $! --files --guard
          wait $! || true
      - name: the engine and the control agree on 500 random streams
        run: |
          up() { for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; return 1; }
          ./httpd --port 8090 & A=$!; up 8090
          ./control 8091 & B=$!; up 8091
          ./fuzz 8090 8091 500 7
          kill $A $B; wait $A $B || true
      - name: the same checks over TLS
        run: |
          up() { for _ in $(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; return 1; }
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 2 -nodes -subj "/CN=localhost"
          ./httpd --port 8443 --tls-cert cert.pem --tls-key key.pem --root www --idle-ms 600 --log 2>tlog.txt & up 8443
          ./check-tls 8443 $! --files --idle=600 --ws --log=tlog.txt --root=www
          kill $!; wait $! || true
          ./httpd --port 8443 --tls-cert cert.pem --tls-key key.pem --max-conns 2 & up 8443
          ./check-tls 8443 $! --conns=2; kill $!; wait $! || true
      - name: a shared port takes two copies, and --workers forks them
        run: |
          up() { for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; return 1; }
          ./httpd --shared --port 8085 & A=$!; ./httpd --shared --port 8085 & B=$!; up 8085
          LOAD_SPIN=1 ./load 8085 32 2 8 /health
          kill $A $B; wait $A $B || true
          ./httpd --workers 2 --shared --port 8086 & A=$!; up 8086
          LOAD_SPIN=1 ./load 8086 32 2 1 /health
          kill $A; wait $A
  # the effects' contracts (conform.c drives each through its cases); the
  # client (wire/client.bend) against the engine, plain and over TLS, and
  # nginx, whole and streamed; the proxy in front of an upstream that
  # records every byte, nginx beside it; the RESP server; the sink's
  # uploads in bounded memory; the WebSocket peers
  peers:
    name: the client, the proxy, RESP, the sink and WebSocket
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bins
      - name: nginx
        run: tar xzf bins.tgz && (sudo apt-get update -qq && sudo apt-get install -y -qq nginx || true)
      - name: the effects keep their contracts
        run: ./conform-peer ./conform 8095 "$PWD/conform-root/root"
      - name: the client fetches from the engine and from nginx
        run: bash demos/io_http_client/check.sh ./hc ./httpd 8840
      - name: the proxy forwards only what it framed
        run: python3 demos/io_proxy/check.py ./proxyd 8850 --nginx
      - name: the RESP server answers on bend-wire
        run: python3 demos/io_resp/smoke.py ./respd 6380
      - name: the sink streams uploads in bounded memory
        run: bash demos/io_sink/check.sh ./sink 8880
      # the WebSocket client against the engine's /ws echo, plain and over
      # TLS, a raw server that sends what no library will, and the
      # websockets library; the server (net/ws_server.bend) against a raw
      # client, the client above and the library
      - name: the WebSocket client and server talk to real peers
        run: |
          pip install -q websockets || true
          python3 net/ws_check.py ./wsc ./httpd 8860 --server ./wsecho
  # bend-net's examples, built here side by side (check.py takes what is
  # built), against every default they promise: framing, timeouts,
  # limits, the router, files, JSON, SIGTERM, and the client's TLS,
  # redirects, gzip and pooling
  net:
    name: bend-net's examples keep their defaults
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang
      - name: bend-net's examples keep their defaults
        run: |
          mkdir -p net-bin
          ls net/examples/*.bend | xargs -P "$(nproc)" -I{} sh -c 'n=$(basename "$1" .bend)
            bun bend2/main.ts "$1" -o "net-bin/$n" > "net-bin/$n.log" 2>&1 || { cat "net-bin/$n.log"; exit 1; }' _ {}
          python3 net/check.py --bin net-bin --port 8870
  # bend-h2: h2c by prior knowledge and h2 over TLS by ALPN, each through
  # h2spec (every section, strict), then check.py's client: requests,
  # fifty streams at once, 1 MB through the windows both ways, and each
  # flood budget met
  h2:
    name: bend-h2 answers, and passes h2spec
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bins
      - name: bend-h2 answers, and passes h2spec
        run: |
          up() { for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null && return 0; sleep 0.1; done; return 1; }
          tar xzf bins.tgz
          pip install -q h2
          curl -fsSL -o h2spec.tgz https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          tar xzf h2spec.tgz h2spec
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 2 -nodes -subj "/CN=localhost"
          ./h2d --port 8443 & up 8443
          ./h2spec -h 127.0.0.1 -p 8443 -S
          python3 demos/io_http2/check.py 8443
          kill $!; wait $! || true
          ./h2d --port 8444 --tls-cert cert.pem --tls-key key.pem & up 8444
          ./h2spec -h 127.0.0.1 -p 8444 -t -k -S
          kill $!; wait $! || true
